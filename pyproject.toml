[project]
name = "PhoeniX"
version = "0.0.1"
authors = [
    {name = "Frederik Unger", email = "frederik.unger@uni-siegen.de"},
    {name = "Moritz Puritscher", email = "moritz.puritscher@uni-tuebingen.de"},
    {name = "Sebastian Retzbach", email = "sebastian.retzbach@uni-tuebingen.de"}
]

maintainers = [
    {name = "Frederik Unger", email = "frederik.unger@uni-siegen.de"},
    {name = "Moritz Puritscher", email = "moritz.puritscher@uni-tuebingen.de"},
    {name = "Sebastian Retzbach", email = "sebastian.retzbach@uni-tuebingen.de"}

]
description = "A python-based package for the analysis of xpcs data using pyFAI"
keywords = ["xpcs", "saxs"]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "matplotlib",
    "pyFAI"
]

[project.optional-dependencies]
tests = ["pytest", "pytest-cov"]
docs = ["jupyter-book", "sphinx"]
build = ["build", "twine"]

[project.urls]
Source = "https://github.com/moritz-3/PhoeniX"
Issues = "https://github.com/moritz-3/PhoeniX/issues"
Documentation = "https://github.com/moritz-3/PhoeniX"
